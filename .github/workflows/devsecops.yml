name: Shift-Left DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-analysis-and-tests:
    name: SAST and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install bandit # Install Bandit SAST directly in the runner

      - name: Run Pytest (Unit Testing)
        run: |
          cd backend
          # This ensures our API endpoints function exactly as expected
          pytest 

      - name: Run Bandit (Static Application Security Testing)
        run: |
          cd backend
          # -r: recursive, -ll: report only medium/high severity, -ii: report medium/high confidence
          bandit -r . -ll -ii -x ./venv,./tests.py

  container-security:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: code-analysis-and-tests # Only run if tests and SAST pass
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t restaurant-backend:ci-test ./backend

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'restaurant-backend:ci-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'